- name: check_format_state
  become: yes
  stat: path={{ item }}/current
  with_items: "{{ dfs_namenode_name_dirs }}"
  register: namenode_format_state

- name: Refuse to format an existing NameNode
  assert:
    that:
      - dfs_namenode_name_dirs | length > 0
      - namenode_format_state.results | selectattr('stat.exists') | list | length == 0
    fail_msg: 'Refusing to format existing NameNode storage; preserve it for restart or migration.'

- name: FORMAT_namenode
  become: yes
  become_user: hdfs
  command: hdfs namenode -format -nonInteractive

- name: FORMAT_ZKFC
  become: yes
  become_user: hdfs
  shell: hdfs zkfc -formatZK -force
  when: hadoop_namenode_servers|length > 1
