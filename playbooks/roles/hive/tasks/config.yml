- name: create_hive_metastore_dir
  become: yes
  file: path={{ hive_metastore_dir }} state=directory owner=hive group=hadoop mode=0777

- name: create_hive_conf_dir
  become: yes
  file: path=/etc/hive/conf state=directory owner=root group=root mode=0755

- include_tasks: principal.yml
  vars: { kerberos_princ_username: hive, kerberos_princ_keytab_path: /etc/hive/conf/hive.keytab, kerberos_princ_keytab_owner: hive }
  when: kerberos_realm is defined

- name: copy_hive_conf
  become: yes
  template: src=hive-site.xml.j2 dest=/etc/hive/conf/hive-site.xml owner=root group=root mode=0644
